name: test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # Production's Ruby
    container: ruby:3.4.12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@postgres/shoppe_test
    steps:
      - uses: actions/checkout@v5
      # Rails needs a JavaScript runtime to boot
      - run: apt-get update && apt-get install -y nodejs
      - run: bundle install
      - run: bin/rails db:create db:schema:load
      - run: bundle exec rspec

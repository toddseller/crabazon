version: "3.8"
services:
  web:
    env_file:
      - .env
    build:
      context: .
      args:
        - DATABASE_URL=$DATABASE_URL
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -u thin -p 5666 -b '0.0.0.0'"
    environment:
      - PGPASSFILE=/run/secrets/pgpass
    volumes:
      # /dev/null default: without PGPASS_FILE, Docker would create a directory at a missing path
      - ${PGPASS_FILE:-/dev/null}:/run/secrets/pgpass:ro
    restart: unless-stopped
    ports:
      - "5666:5666"
